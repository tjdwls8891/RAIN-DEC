# 시험용 시나리오: 최소 구현을 검증하기 위한 한 장면.
# 숨겨진 진실(주모와 흑풍채의 관계, 척후의 정체, 열쇠의 위치)이 있어 정보 격리를 확인할 수 있다.
이름: 만리객잔의 밤
어조: "무협. 건조하고 감각적인 문장. 과장하지 않는다."
전제: "강남의 저잣거리. 산적 무리 흑풍채가 근방 상단을 노린다는 소문이 돈다."
시작: {PC: 강호민, 시각: 1260}     # 21:00

개체:
  저잣거리류:
    표지: [분류헤드]
    사실:
      - '분위기(이것) = "늦은 밤. 등불 몇 개만 남았고 멀리서 개 짖는 소리가 난다."'
  만리객잔:
    표지: [장소]
    사실: ['소속(이것) = 저잣거리류', '외양(이것) = "이층짜리 낡은 목조 객잔."']
  객잔_1층:
    표지: [장소]
    사실:
      - '위치(이것 → 만리객잔) = 안에'
      - '외양(이것) = "탁자 여섯에 계산대 하나. 기름 등잔이 그을음을 낸다."'
      - '조도(이것) = 어스름'
  객잔_창고:
    표지: [장소]
    사실: ['위치(이것 → 만리객잔) = 안에', '외양(이것) = "쌀자루와 술독이 쌓인 좁은 방."', '조도(이것) = 캄캄함']
  뒷골목:
    표지: [장소]
    사실: ['소속(이것) = 저잣거리류', '외양(이것) = "객잔 뒤로 난 좁은 흙길."', '조도(이것) = 어두움']
  창가: {표지: [지점], 사실: ['위치(이것 → 객잔_1층) = 안에']}
  계산대: {표지: [지점], 사실: ['위치(이것 → 객잔_1층) = 안에']}
  구석_탁자: {표지: [지점], 사실: ['위치(이것 → 객잔_1층) = 안에']}

  뒷문:
    표지: [통로]
    사실:
      - '위치(이것 → 객잔_1층) = 안에'
      - '잇는다(이것) = [객잔_1층, 뒷골목]'
      - '잠김(이것) = 참'
      - '견고함(이것) = 단단함'
      - '외양(이것) = "계산대 뒤편의 두꺼운 나무문. 쇠 자물쇠가 걸려 있다."'
  창고문:
    표지: [통로]
    사실: ['위치(이것 → 객잔_1층) = 안에', '잇는다(이것) = [객잔_1층, 객잔_창고]', '외양(이것) = "발이 쳐진 낮은 문."']

  강호민:
    표지: [인물, PC]
    사실:
      - '위치(이것 → 창가) = 곁에'
      - '외양(이것) = "먼지 묻은 여행복 차림의 젊은 검객."'
      - '근력(이것) = 12'
      - '민첩(이것) = 14'
      - '통찰(이것) = 11'
      - '숙련(이것 → 검술) = 중'
      - '피로(이것) = 보통'
  주모:
    표지: [인물]
    사실:
      - '위치(이것 → 계산대) = 뒤에'
      - '이름(이것) = 주모'
      - '역할(이것) = 객잔 주인'
      - '외양(이것) = "쉰 줄의 여인. 소매를 걷어붙였고 손등에 오래된 화상 자국이 있다."'
      - '성격(이것) = "셈이 빠르고 의심이 많다. 약한 사람에게는 무르지만 캐묻는 사람은 싫어한다."'
      - '말투(이것) = "반말 섞인 장삿말. 경계하면 말수가 준다."'
      - '목표(이것) = "오늘 밤을 조용히 넘긴다. 동생이 보낸 사내가 볼일을 마치고 뒷문으로 나가게 한다."'
      - '비밀(이것) = "흑풍채 두목이 친동생이다. 누구에게도 알리고 싶지 않다."'
      - '지킨다(이것 → 흑풍채 두목이 동생이라는 것) = 매우 큼'
      - '지킨다(이것 → 뒷문을 아무에게나 열어 주지 않는 것) = 큼'
      - '지킨다(이것 → 객잔의 장사와 평판) = 보통'
      - '기분(이것) = 경계'
      - '호감(이것 → 강호민) = 무관심'
      - '통찰(이것) = 13'
  척후:
    표지: [인물]
    사실:
      - '위치(이것 → 구석_탁자) = 곁에'
      - '이름(이것) = 삿갓 쓴 사내'
      - '외양(이것) = "삿갓을 깊이 눌러쓴 마른 사내. 술잔에는 손을 대지 않는다."'
      - '정체(이것) = 흑풍채 척후'
      - '성격(이것) = "말이 없고 인내심이 깊다. 들키면 싸우지 않고 빠져나간다."'
      - '말투(이것) = "짧고 낮은 목소리. 묻는 말에만 답한다."'
      - '목표(이것) = "내일 지나갈 상단의 호위 수를 주모에게 전해 듣고 뒷문으로 빠져나간다."'
      - '지킨다(이것 → 자기 소속과 정체) = 큼'
      - '지킨다(이것 → 주모와 두목의 관계) = 매우 큼'
      - '기분(이것) = 경계'
      - '호감(이것 → 강호민) = 경계'
      - '민첩(이것) = 15'

  철검:
    표지: [물건, 장비]
    사실: ['위치(이것 → 강호민) = 허리에', '외양(이것) = "손때 묻은 철검."', '용도(이것 → 베기) = 가능']
  단도:
    표지: [물건, 장비]
    사실: ['위치(이것 → 척후) = 품에', '외양(이것) = "날이 얇은 단도."', '용도(이것 → 찌르기) = 가능']
  뒷문_열쇠:
    표지: [물건]
    사실: ['외양(이것) = "녹이 슨 쇠 열쇠."', '여는것(이것 → 뒷문) = 참']
  계산대_서랍:
    표지: [물건, 용기]
    사실:
      - '위치(이것 → 계산대) = 안에'
      - '외양(이것) = "계산대 아래의 나무 서랍."'
      - '있을법한것(이것) = [엽전 꿰미, 치부책, 주판, 빈 약첩, 부싯돌, 낡은 손수건, 초 토막, 대못 몇 개]'
  찻주전자:
    표지: [물건]
    사실: ['위치(이것 → 창가) = 위에', '외양(이것) = "이가 빠진 질그릇 찻주전자. 식은 차가 반쯤 들어 있다."', '견고함(이것) = 무름']
  나무_의자:
    표지: [물건]
    사실: ['위치(이것 → 창가) = 곁에', '외양(이것) = "등받이 없는 낡은 나무 의자."']
  술독:
    표지: [물건, 용기]
    사실: ['위치(이것 → 객잔_창고) = 안에', '외양(이것) = "허리 높이의 술독."']

변수:
  열쇠가_있는_곳:
    후보: [계산대_서랍, 주모, 술독]
    적용: ['위치(뒷문_열쇠 → {값}) = 안에']

시야:
  주모:
    - '정체(척후) = 흑풍채 척후'
    - '잠김(뒷문) = 참'
  척후:
    - '비밀(주모) = "두목의 누이다."'
