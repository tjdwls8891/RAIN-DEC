# 공용 사전 (최소판). 엔진이 모든 시나리오에 제공하는 정의.
# 값: 목록이면 등급(순서가 크기), 없으면 자유 값.  겉보기: 누구나 / 관찰 / 숨김.  계승: 위에서 물려받는가.
정의:
  위치: {겉보기: 누구나}
  원형: {겉보기: 숨김}
  소속: {겉보기: 숨김}
  이름: {겉보기: 누구나}
  외양: {겉보기: 누구나, 서술: true}
  서술: {겉보기: 누구나, 서술: true}
  분위기: {겉보기: 누구나, 서술: true, 계승: true}
  조도: {값: [캄캄함, 어두움, 어스름, 밝음], 겉보기: 누구나, 계승: true, 기본: 밝음}
  소음: {값: [고요, 낮음, 보통, 큼], 겉보기: 누구나, 기본: 낮음}
  잇는다: {겉보기: 누구나}
  잠김: {값: [참, 거짓], 겉보기: 관찰, 기본: 거짓}
  열림: {값: [참, 거짓], 겉보기: 누구나, 기본: 거짓}
  있을법한것: {겉보기: 숨김}      # 저작되지 않은 속을 채울 때의 후보 (확정의 사다리)
  채워짐: {값: [참, 거짓], 겉보기: 숨김, 기본: 거짓}
  숨김: {값: [참, 거짓], 겉보기: 숨김, 기본: 거짓}
  여는것: {겉보기: 숨김}
  용도: {겉보기: 관찰}
  수량: {겉보기: 관찰}
  상태: {겉보기: 관찰}

  # 신체
  근력: {겉보기: 숨김}
  민첩: {겉보기: 숨김}
  통찰: {겉보기: 숨김}
  숙련: {값: [없음, 하, 중, 상, 극], 겉보기: 숨김, 기본: 없음}
  피로: {값: [없음, 낮음, 보통, 높음, 극심], 겉보기: 관찰, 기본: 없음}
  허기: {값: [없음, 낮음, 보통, 높음, 극심], 겉보기: 숨김, 기본: 낮음}
  부상: {겉보기: 관찰, 서술: true}

  # 심리와 관계
  성격: {겉보기: 숨김, 서술: true}
  말투: {겉보기: 숨김, 서술: true}
  목표: {겉보기: 숨김, 서술: true}
  비밀: {겉보기: 숨김, 서술: true}
  기분: {값: [평온, 경계, 불안, 분노, 두려움, 호의], 겉보기: 관찰, 기본: 평온}
  호감: {값: [적대, 경계, 무관심, 호의, 신뢰], 겉보기: 숨김, 기본: 무관심}
  정체: {겉보기: 숨김}
  지킨다: {값: [작음, 보통, 큼, 매우 큼], 겉보기: 숨김}     # 지킨다(인물 → 지키려는 것) = 무게. 속임·설득·위협의 난이도가 된다
  역할: {겉보기: 누구나}
