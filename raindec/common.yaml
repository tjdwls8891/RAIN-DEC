# 공용 사전 (첫 조각). 엔진이 모든 시나리오에 주는 정의.
#
# 항목마다 적는 것
#   값      목록이면 등급(순서가 크기). 없으면 자유로운 값
#   겉보기  누구나 / 관찰(눈여겨봐야) / 숨김
#   계승    위에서 물려받는가        기본  없을 때의 값
#   서술    묘사하는 글인가
#   고침    행동으로 바뀔 수 있는가.  누구나(행동의 귀결로) / 본인(그 인물 스스로만) / 없으면 바뀌지 않는다
#   조건    그 값이 되려면 참이어야 하는 것. {값: [조건...]}. 걸리면 변화는 일어나지 않고 '걸리면'의 글이 결과가 된다
#   걸리면  {값: 글}  조건에 걸렸을 때 행동한 이가 지각하는 것.  '알게됨'의 항목을 그때 알게 된다
#   드러남  {값: 글}  그 값이 겉으로 어떻게 보이고 들리는가. 서술의 재료가 된다 (값의 이름을 그대로 넘기지 않는다)
#   붙는곳  이 항목을 가질 수 있는 것의 표지. 없으면 어디에나
#   기준    {값: 글}  그 값이 붙거나 떨어지는 저작된 기준. 판단이 이 기준으로 가린다
#   내면    PC의 것이면 플레이어만 정한다
#   능력    판정에 쓰는 능력치인가
#   버팀    이 항목을 힘으로 바꾸려 할 때의 난이도를 어느 항목에서 읽는가
#
# 조건에서  이것 = 바뀌는 개체,  행위자 = 바꾸려는 이
정의:
  위치: {겉보기: 누구나, 고침: 누구나}          # 자리의 제약은 엔진이 본다 (길, 닫힌 용기, 남이 지닌 것)
  원형: {겉보기: 숨김}
  소속: {겉보기: 숨김}
  이름: {겉보기: 누구나}
  외양: {겉보기: 누구나, 서술: true}
  서술: {겉보기: 누구나, 서술: true}
  분위기: {겉보기: 누구나, 서술: true, 계승: true}
  조도: {값: [캄캄함, 어두움, 어스름, 밝음], 겉보기: 누구나, 계승: true, 기본: 밝음}
  소음: {값: [고요, 낮음, 보통, 큼], 겉보기: 누구나, 기본: 낮음}
  잇는다: {겉보기: 누구나}
  잠김:
    값: [참, 거짓]
    겉보기: 관찰
    기본: 거짓
    고침: 누구나
    붙는곳: [통로, 용기]
    조건: {거짓: [열쇠를 지님], 참: [열쇠를 지님]}
    걸리면: {거짓: "자물쇠는 열쇠 없이는 풀리지 않는다.", 참: "잠글 열쇠가 없다."}
    드러남: {참: "잠겨 있다.", 거짓: "잠겨 있지 않다."}
  열림:
    값: [참, 거짓]
    겉보기: 누구나
    기본: 거짓
    고침: 누구나
    붙는곳: [통로, 용기]
    조건: {참: ["잠김(이것) = 거짓"]}
    걸리면: {참: "잠겨 있다. 밀어도 당겨도 열리지 않는다."}
    알게됨: [잠김]
    드러남: {참: "열려 있다.", 거짓: "닫혀 있다."}
  손상:
    값: [없음, 흠, 파손]
    겉보기: 누구나
    기본: 없음
    고침: 누구나
    붙는곳: [물건, 통로]
    버팀: 견고함
    드러남: {흠: "흠이 났다.", 파손: "부서졌다."}
  견고함: {값: [무름, 보통, 단단함, 매우 단단함], 겉보기: 관찰, 기본: 보통}
  숨김: {값: [참, 거짓], 겉보기: 숨김, 기본: 거짓}
  닫힌범위: {값: [참, 거짓], 겉보기: 숨김, 기본: 거짓, 계승: true}   # 참이면 그 장소에서는 저작되지 않은 것이 발견되지 않는다
  재질: {겉보기: 관찰}                       # 재질(물건) = 재질 개체. 재질의 성질을 물려받는다
  가이드: {겉보기: 숨김, 서술: true}          # 그 인물만의 태도와 판단 방식
  있을법한것: {겉보기: 숨김}      # 저작되지 않은 속을 채울 때의 후보 (확정의 사다리)
  채워짐: {값: [참, 거짓], 겉보기: 숨김, 기본: 거짓}
  여는것: {겉보기: 숨김}
  용도: {겉보기: 관찰}
  수량: {겉보기: 관찰}
  상태: {겉보기: 관찰}

  # 신체
  근력: {겉보기: 숨김, 능력: true}
  민첩: {겉보기: 숨김, 능력: true}
  통찰: {겉보기: 숨김, 능력: true}
  숙련: {값: [없음, 하, 중, 상, 극], 겉보기: 숨김, 기본: 없음}
  자세: {값: [서 있음, 앉음, 웅크림, 누움], 겉보기: 누구나, 기본: 서 있음, 고침: 본인, 붙는곳: [인물],
         드러남: {서 있음: "일어서 있다.", 앉음: "앉아 있다.", 웅크림: "몸을 낮게 웅크리고 있다.", 누움: "누워 있다."}}
  피로: {값: [없음, 낮음, 보통, 높음, 극심], 겉보기: 관찰, 기본: 없음,
         드러남: {높음: "숨이 거칠고 어깨가 처져 있다.", 극심: "몸을 가누지 못한다."}}
  허기: {값: [없음, 낮음, 보통, 높음, 극심], 겉보기: 숨김, 기본: 낮음}
  부상: {겉보기: 관찰, 서술: true}

  # 심리와 관계
  성격: {겉보기: 숨김, 서술: true}
  말투: {겉보기: 숨김, 서술: true}
  목표: {겉보기: 숨김, 서술: true}
  비밀: {겉보기: 숨김, 서술: true}
  기분:
    값: [평온, 경계, 불안, 분노, 두려움, 호의]
    겉보기: 관찰
    기본: 평온
    고침: 본인
    내면: true
    드러남:
      평온: "어깨에 힘이 빠져 있고 손놀림이 고르다."
      경계: "몸이 이쪽으로 반쯤 돌아가 있고, 눈길이 자주 이쪽에 머문다."
      불안: "손이 가만있지 못하고 눈길이 한곳에 머물지 않는다."
      분노: "턱에 힘이 들어가 있고 목소리가 높다."
      두려움: "낯빛이 희고 몸이 뒤로 물러나 있다."
      호의: "낯이 풀려 있고 몸이 이쪽을 향해 있다."
  호감: {값: [적대, 경계, 무관심, 호의, 신뢰], 겉보기: 숨김, 기본: 무관심, 고침: 본인, 내면: true}
  정체: {겉보기: 숨김}
  역할: {겉보기: 누구나}
  지킨다: {값: [작음, 보통, 큼, 매우 큼], 겉보기: 숨김}     # 지킨다(인물 → 지키려는 것) = 무게

# 귀결의 규칙: 조건이 참이 되면 귀결이 따른다. 어떤 행동으로 그렇게 되었든 같다.
규칙:
  - 이름: 부서진 것은 잠그지 못한다
    표지: [통로, 용기]
    조건: ["손상(이것) = 파손"]
    귀결: ["잠김(이것) = 거짓"]

# 힘으로 바꾸려 할 때의 난이도 (버팀의 등급 → 난이도)
버팀값: {무름: 10, 보통: 0, 단단함: -15, 매우 단단함: -30}

# 걸리는 시간의 등급 → 분. 시나리오가 제 세계의 낱말로 바꾼다.
시간등급: {잠깐: 1, 몇 분: 5, 한참: 20, 한 시간쯤: 60, 반나절: 360}

# 맞서는 이가 있을 때 견주는 능력. 말: 속임·설득, 손: 남이 지닌 것을 가져옴, 힘: 버티는 것을 힘으로 바꿈
맞섬: {말: 통찰, 손: 민첩, 힘: 근력}

# 사람 일반의 가이드: 상황별로 사람이 흔히 어떻게 굴고 말하는가. (내용은 나중에 저작한다)
가이드: ""

# 행동의 유형: 판정이 필요한가의 기준과, 판단에 필요한 정보를 꾸리는 데 쓴다. 행동을 막거나 결과를 정하는 데 쓰지 않는다.
#   능력  굴린다면 기본으로 쓰는 능력        살핌  대상의 '관찰' 항목을 알게 되는가
#   정보  대상에서 더 꺼내 올 것             굴림  굴리는가를 가릴 때의 기준 한 줄
유형:
  메타/규칙 입력: {}
  관찰/조사/지식: {능력: 통찰, 살핌: true, 굴림: "숨겨진 것을 찾을 때만. 눈에 보이는 것을 보는 데는 굴리지 않는다."}
  이동/운송: {능력: 민첩, 굴림: "길이 험하거나 막는 이가 있을 때만."}
  물체/설비 조작: {능력: 민첩, 정보: [속, 견고함], 굴림: "흔한 조작은 굴리지 않는다. 힘이나 솜씨가 모자랄 수 있을 때만."}
  자원/소유/거래: {능력: 통찰, 정보: [속], 굴림: "건네고 받는 일은 굴리지 않는다. 몰래 가져가거나 빼앗을 때."}
  제작/수리/건설: {능력: 민첩, 정보: [속, 견고함], 굴림: "솜씨가 필요한 일이면."}
  신체/치료/생존: {능력: 근력, 굴림: "제 몸을 움직이는 흔한 일은 굴리지 않는다."}
  공격/제압/피해: {능력: 민첩, 정보: [견고함], 굴림: "버티는 것이나 맞서는 이가 있으면 굴린다."}
  방어/회피/보호: {능력: 민첩, 굴림: "닥친 위협이 있으면 굴린다."}
  환경/공간 변화: {능력: 근력, 정보: [속, 견고함], 굴림: "힘이나 솜씨가 모자랄 수 있을 때만."}
  의사소통/설득/기만: {능력: 통찰, 정보: [지킨다], 굴림: "상대가 지키려는 것에 닿을 때."}
  은폐/위장/추적: {능력: 민첩, 굴림: "알아챌 이가 있으면 굴린다."}
  관계/소속/약속: {능력: 통찰, 정보: [지킨다], 굴림: "상대가 지키려는 것에 닿을 때."}
  협력/지휘: {능력: 통찰, 굴림: "따를 까닭이 없는 이를 움직일 때."}
  계획/준비/조건부행동: {능력: 통찰, 굴림: "굴리지 않는다. 품은 뜻으로 남긴다."}
  장기과업/조직운용: {능력: 통찰, 굴림: "일의 고비에서."}
  특수능력: {능력: 통찰, 굴림: "능력의 정의를 따른다."}
  목표/선택/거부: {능력: 통찰, 굴림: "굴리지 않는다."}
